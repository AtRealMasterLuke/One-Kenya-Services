name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Tests and analytics check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Start database and build app
        run: |
          docker compose up -d db
          docker compose build web
      - name: Load ward boundaries
        run: docker compose run --rm --user root web python manage.py load_wards
      - name: Run tests
        run: docker compose run --rm --user root web python -m pytest -p no:cacheprovider
      - name: Replay the sample dataset and check the dashboard figures independently
        run: |
          docker compose run --rm --user root -e SEED_DEMO=0 web sh -c '
            python manage.py migrate --noinput &&
            python manage.py load_wards &&
            python manage.py seed_demo &&
            python manage.py replay_311 &&
            python manage.py export_analytics --as-of 2025-03-15T00:00 --source replay --out /tmp/app.json &&
            python -I scripts/verify_analytics.py --as-of 2025-03-15T00:00 --compare /tmp/app.json'
